# Tasker Image Matcher - one-file GitHub build.
# Contains all project source and Gradle files as compressed data below.
# New installation after uninstalling old app; debug signing key is generated in cloud.
# Each cloud build can have a different debug signature; uninstall before reinstall if signatures differ.
name: Tasker Image Matcher - One File APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore self-contained app source
