        run: |
          python3 - <<'PYCODE'
          import os, base64, io, tarfile
          encoded = os.environ["SOURCE_TARGZ_BASE64"].replace(' ', '').replace('\n', '')
          blob = base64.b64decode(encoded)
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as archive:
              for item in archive.getmembers():
                  if item.name.startswith('/') or '..' in item.name.split('/'):
                      raise ValueError("Unsafe source path")
              archive.extractall('.')
          print("Restored Android app and Gradle settings.")
          PYCODE

      - name: Restore original debug signing key
        shell: bash
        env:
          ORIGINAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.ORIGINAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ORIGINAL_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Please set ORIGINAL_DEBUG_KEYSTORE_BASE64 secret to original Android Studio debug.keystore. Without it the APK cannot update the installed app.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ORIGINAL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build signed APK
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_CODE=$((10000 + RUN_NUMBER))
          gradle :app:assembleDebug --no-daemon --stacktrace -PcloudBuildNumber="$BUILD_CODE"

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskerImageMatcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
