        run: |
          python3 - <<'PYCODE'
          import os, base64, io, tarfile
          encoded = os.environ["SOURCE_TARGZ_BASE64"].replace(' ', '').replace('\n', '')
          blob = base64.b64decode(encoded)
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as archive:
              for item in archive.getmembers():
                  if item.name.startswith('/') or '..' in item.name.split('/'):
                      raise ValueError("Unsafe source path")
              archive.extractall('.')
          print("Restored Android app and Gradle settings.")
          PYCODE

      - name: Build APK (new installation)
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_CODE=$((10000 + RUN_NUMBER))
          gradle :app:assembleDebug --no-daemon --stacktrace -PcloudBuildNumber="$BUILD_CODE"

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskerImageMatcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
