# Tasker Image Matcher - one-file GitHub build.
# Includes updated app: independent image thresholds and one-shot ignore options.
# Contains all project source and Gradle files as compressed data below.
# NEVER paste a keystore or signing secret into this file.
name: Tasker Image Matcher - Per Image One Shot APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore self-contained app source
